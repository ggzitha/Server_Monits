services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server_monits_dev_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/server_monits
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monits_net

  db:
    image: postgres:16-alpine
    container_name: server_monits_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: server_monits
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d server_monits"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - monits_net

volumes:
  postgres_dev_data:

networks:
  monits_net:
    driver: bridge

